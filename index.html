<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forma">
<meta name="theme-color" content="#F3F0E8">
<title>Forma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0E8; --card:#FFFFFF; --ink:#17181A; --muted:#5E6158; --line:#E2DDD0; --track:#EDE8DC;
  --green:#255C45; --green-soft:#EAF2ED; --green-ink:#1E4A37;
  --red:#C8462B; --red-ink:#B23D24; --red-soft:#F8E4DD; --ochre:#C99A2E; --gold:#9A6B00; --gold-soft:#FBF0D2;
  --display:'Bricolage Grotesque', -apple-system, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh}
.view{padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
.view.no-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
h1{margin:0;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
h1.small{font-size:24px} h1.mid{font-size:26px} h1.xl{font-size:36px}
h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
h3{margin:0;font-size:17px;font-weight:700}
h3.disp{font-family:var(--display);font-size:23px}
.sub{font-size:13px;color:var(--muted);font-weight:500}
.sub.small{font-size:12px}
.right{text-align:right}
.lead{font-size:16px;line-height:1.45}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.pt{padding-top:12px}.mt{margin-top:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.between.top{align-items:flex-start}.between.bottom{align-items:flex-end}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.tight{gap:8px}
.card.green{background:var(--green);color:#fff}
.card.green .sub{color:#DCEBE2}
.big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.big.mid{font-size:28px}
.n20{font-size:20px}
.unit{font-family:var(--body);font-size:15px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.chip.train{background:var(--green);color:#fff;border-color:var(--green)}
.chip.rest,.chip.all{background:#E7E2D5;border-color:#E7E2D5}
.chip.soft{background:var(--green-soft);border-color:var(--green-soft);color:var(--green-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:none;font-weight:700;font-size:15px;text-decoration:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.white{background:#fff;color:var(--green)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:#fff;border:1px solid #E6C3B8;color:var(--red-ink);font-weight:600}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px;flex-shrink:0}
.btn.full{width:100%}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid #DCD6C8;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-size:20px;font-weight:700;line-height:1}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.plain-x{border:none;color:var(--red-ink);background:transparent}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macro .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.macro .bar i{display:block;height:100%;width:100%;border-radius:3px}
.macro b{font-size:17px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:#E7E2D5;border-radius:14px}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.seg button{min-height:42px;border:none;border-radius:10px;background:transparent;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .seg{background:#EFEBE1}
input.time{height:44px;border:1px solid var(--line);border-radius:12px;background:#FBF9F4;padding:0 12px;font-size:17px;font-weight:600;min-width:120px;-webkit-appearance:none;appearance:none}
.meal{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.items li span:last-child{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.meal .foot{font-size:13px;color:var(--muted);line-height:1.45}
.tag{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.tag.red{color:var(--red-ink)} .tag.green{color:var(--green)}
.card.green .tag.green{color:#CFE3D8}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border-radius:14px;padding:12px 16px;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.li .r{color:var(--muted);font-size:14px;white-space:nowrap}
.btnrow{border:none;text-align:left;width:100%}
.btnrow .row{gap:10px}
.danger-t{color:var(--red-ink)}
.pickrow{padding:4px 6px 4px 4px}
.pickrow .grow{flex:1;border:none;background:none;text-align:left;padding:8px 12px;min-height:48px}
.ex{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.restrow{display:flex;justify-content:space-between;align-items:center;background:#F6F3EC;border-radius:12px;padding:4px 4px 4px 14px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:40px;border:none;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.stepper b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px;border-radius:12px}
.set.done{background:var(--green-soft)}
.set .n{font-weight:700;text-align:center;display:flex;justify-content:center}
.set input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#FBF9F4;text-align:center;font-size:17px;font-weight:600;padding:0 4px}
.set.done input{background:#fff}
.set .chk{width:48px;height:44px;border-radius:12px;border:1.5px solid #CFC8B8;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.set.done .chk{background:var(--green);border-color:var(--green)}
.prmark{color:var(--gold);display:inline-flex}
.prmark svg{width:20px;height:20px}
.prbadge{display:inline-flex;align-items:center;gap:3px;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:3px 8px;font-size:13px;font-weight:700}
.prbadge svg{width:15px;height:15px}
.sethead{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;padding:0 4px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:17px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.field input[type=date]{display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.sheet .stat{background:#F6F3EC}
.stat b{font-family:var(--display);font-size:22px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.callout{background:#F6F3EC;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.callout.green{background:var(--green-soft);color:var(--green-ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;justify-content:center;border:none;background:none;color:#6B6E64;font-size:11px;font-weight:500}
nav.tabs button.on{color:var(--ink);font-weight:700}
#timer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 70px);max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px 10px 18px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:11;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#timer.show{display:flex}
#timer b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
#timer button{min-height:40px;border-radius:10px;border:none;padding:0 12px;background:#2E3033;color:#fff;font-weight:600}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);max-width:536px;margin:0 auto;background:var(--gold-soft);color:#3D2B00;border:1px solid #EBD28E;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.15);transform:translateY(-140%);transition:transform .35s ease}
#toast.show{transform:none}
#toast .trophy{color:var(--gold);display:flex}
#toast b{font-size:15px}#toast span{font-size:13px}
.chart{width:100%;height:auto;display:block}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border-radius:18px}
.sheet .empty{background:#F6F3EC}
.edit-ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 40px;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--track)}
.edit-ex.head{border:none;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.edit-ex input{height:42px;border:1px solid var(--line);border-radius:10px;background:#FBF9F4;padding:0 10px;font-size:16px;width:100%;min-width:0}
.edit-ex input.nm{grid-column:1 / -1;font-weight:600}
.edit-ex .x{width:40px;height:40px;border:none;background:none;color:var(--red-ink);padding:0}
details.sess{background:#fff;border-radius:16px;padding:0 16px}
details.sess summary{list-style:none;min-height:54px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.sess summary::-webkit-details-marker{display:none}
details.sess[open]{padding-bottom:14px}
.plain{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.7;color:var(--muted)}
.plain.light{color:#E3EFE8}
.switch{width:52px;height:32px;border-radius:16px;border:none;background:#D9D3C5;position:relative;padding:0;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--green)} .switch.on i{left:23px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chipbtn{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;background:#F6F3EC;border-radius:14px;padding:12px}
.checkrow input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--green)}
.exd{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--track)}
textarea#mk{width:100%;min-height:260px;border:1px solid var(--line);border-radius:14px;background:#FBF9F4;padding:12px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.prev{background:#F6F3EC;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.prev ul{margin:4px 0 10px;padding-left:18px;color:var(--muted)}
.legend summary{font-size:14px;font-weight:600;color:var(--green);min-height:32px;display:flex;align-items:center}
.pdfpages{display:flex;flex-direction:column;gap:10px}
.pdfpages canvas{border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#fff}
/* pannello dal basso */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(23,24,26,.4)}
.sheet-card{position:relative;background:#fff;width:100%;max-width:560px;max-height:90vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 20px}
.sheet-head h3{flex:1;font-size:19px;font-family:var(--display)}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
#sheetBody .li{background:#F6F3EC}
.callout.sm{font-size:13px;padding:8px 12px;background:#FFF7E0;color:#5A4300}
.hint{font-size:14px;background:var(--green-soft);color:var(--green-ink);border-radius:12px;padding:8px 12px}
.items li.choose{display:block}
.items li.choose button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#FBF9F4;border-radius:12px;padding:8px 10px 8px 12px;text-align:left;min-height:52px}
.items li.choose .col{flex:1;gap:2px}
.items li.choose .cf{font-size:15px}
.items li.choose .cq{font-weight:700;white-space:nowrap;font-size:15px}
.items li.choose .chev{color:var(--muted);display:flex}
.mnotes summary{font-size:13px;font-weight:600;color:var(--green);min-height:32px;display:flex;align-items:center;cursor:pointer}
.linkbtn{border:none;background:none;padding:0;color:var(--green);font-weight:700;text-decoration:underline;font-size:13px}
.li.sel{outline:2px solid var(--green)}
.plain .ink{color:var(--ink);font-weight:600}
.plain .small{font-size:13px}
.edit-ex input.note-in{font-weight:400;font-size:14px;height:38px}
.dnotes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.45;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"><main id="view" class="view"></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="timer" role="status" aria-live="polite"><div class="col"><span style="font-size:12px;color:#C9CBC4">Recupero</span><b id="timerTxt">0:00</b></div><div class="row"><button data-a="timerAdd">+15 s</button><button data-a="timerStop">Salta</button></div></div>
<nav class="tabs" id="tabs" aria-label="Navigazione principale"><div class="in">
  <button data-a="tab" data-t="oggi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Oggi</button>
  <button data-a="tab" data-t="piano"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3"/><path d="M17 21V3c-2 1.5-3 4.5-3 8h3"/></svg>Piano pasti</button>
  <button data-a="tab" data-t="work"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Allenamento</button>
  <button data-a="tab" data-t="prog"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-8"/></svg>Progressi</button>
</div></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-a="closeSheet"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><button id="sheetBackBtn" class="icon-btn sm hidden" data-a="sheetBack" aria-label="Indietro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><h3 id="sheetTitle"></h3><button class="icon-btn sm" data-a="closeSheet" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<input type="file" id="importFile" class="hidden">
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
